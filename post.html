<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post | Kahani Ka Pitara</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">📖 Kahani Ka Pitara</a><nav><a href="news.html">News</a><a href="blog.html">Blog</a></nav></div></header><main class="wrap reading" id="p">Loading…</main><script src="app.js"></script><script>const id=new URLSearchParams(location.search).get('id');api('post?id='+encodeURIComponent(id)).then(r=>{const x=r.item;document.title=x.title+' | Kahani Ka Pitara';$('p').innerHTML=`<span class="pill">${esc(x.type==='news'?'📰 News':'📝 Blog')}</span><h1>${esc(x.title)}</h1>${x.image_url?`<img class="story-img" src="${esc(x.image_url)}" alt="">`:''}<p>${esc(x.excerpt)}</p>${x.content.split(/\n+/).map(t=>`<p>${esc(t)}</p>`).join('')}`}).catch(e=>$('p').innerHTML='<div class="panel">❌ '+esc(e.message)+'</div>');track('/post') </script></body></html>
