<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="हिंदी कहानियाँ, News, Blog और Community"><title>Kahani Ka Pitara</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">📖 Kahani Ka Pitara</a><nav><a href="index.html">Stories</a><a href="news.html">📰 News</a><a href="blog.html">📝 Blog</a><a href="community.html">💬 Chat</a><a href="submit.html">✍️ Submit</a><a href="profile.html">👤 Profile</a></nav></div></header><main class="wrap"><section class="hero"><h1>हर कहानी में एक नई दुनिया…</h1><p>हिंदी कहानियाँ पढ़ें, News और Blog पढ़ें, अपनी कहानी भेजें और Community से जुड़ें।</p><div class="search"><input id="q" placeholder="कहानी / bhoot / love / kisan खोजें…"><button id="go">🔍</button></div></section><div id="list" class="grid"><div class="panel">कहानियाँ लोड हो रही हैं…</div></div></main><div class="bottom"><a href="index.html">🏠<br>Home</a><a href="news.html">📰<br>News</a><a href="blog.html">📝<br>Blog</a><a href="community.html">💬<br>Chat</a><a href="profile.html">👤<br>Profile</a></div><script src="app.js"></script><script>let data=[];async function load(){const r=await api('stories');data=r.items||[];render();track(location.pathname)}function render(){const q=$('q').value;const d=data.filter(x=>match(q,x));$('list').innerHTML=d.length?d.map(card).join(''):'<div class="panel">इस खोज के लिए कोई कहानी नहीं मिली।</div>';bindCards()}$('q').addEventListener('input',render);$('go').onclick=render;load()</script></body></html>
