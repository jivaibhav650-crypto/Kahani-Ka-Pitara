<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | Kahani Ka Pitara</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">📖 Kahani Ka Pitara</a><nav><a href="index.html">Stories</a><a href="community.html">Chat</a></nav></div></header><main class="wrap form"><h1>👤 Profile / Login</h1><div class="panel"><div id="logged" class="hidden"><h2 id="who"></h2><p id="role"></p><button class="danger" id="logout">Logout</button></div><div id="auth"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (कम से कम 6 अक्षर)"><input id="name" placeholder="नाम (Sign up के लिए)"><div class="actions"><button class="primary" id="login">Login</button><button class="success" id="signup">Sign up</button></div></div><p id="m"></p></div></main><script src="app.js"></script><script>async function refresh(){const r=await api('auth/me');if(r.user){$('auth').classList.add('hidden');$('logged').classList.remove('hidden');$('who').textContent='नमस्ते, '+(r.user.name||r.user.email);$('role').textContent=r.user.role==='admin'?'🛡️ Admin account':'👤 User account'}else{$('auth').classList.remove('hidden');$('logged').classList.add('hidden')}}$('login').onclick=async()=>{try{await api('auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('pass').value})});$('m').textContent='✅ Login successful';refresh()}catch(e){$('m').textContent='❌ '+e.message}};$('signup').onclick=async()=>{try{const r=await api('auth/signup',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('pass').value,name:$('name').value})});$('m').textContent=r.user?.role==='admin'?'✅ Account बना और Admin access मिला।':'✅ Account बन गया।';refresh()}catch(e){$('m').textContent='❌ '+e.message}};$('logout').onclick=async()=>{await api('auth/logout',{method:'POST'});refresh()};refresh()</script></body></html>
