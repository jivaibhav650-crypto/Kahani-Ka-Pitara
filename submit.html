<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>कहानी भेजें</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">📖 Kahani Ka Pitara</a><nav><a href="index.html">Stories</a><a href="profile.html">Profile</a></nav></div></header><main class="wrap form"><h1>✍️ अपनी कहानी भेजें</h1><div class="panel"><p class="hint">Login optional है। नाम और कहानी भेजें; Admin approval के बाद publish होगी।</p><input id="author" placeholder="आपका नाम"><input id="title" placeholder="Title (खाली छोड़ सकते हैं)"><input id="cat" placeholder="Category"><input id="ex" placeholder="Short description (optional)"><textarea id="content" placeholder="पूरी कहानी"></textarea><textarea id="lesson" placeholder="कहानी की सीख (optional)"></textarea><input id="image" placeholder="Image URL (optional)"><input id="video" placeholder="Video URL (optional)"><button class="primary" id="send">कहानी भेजें</button><p id="msg"></p></div></main><script src="app.js"></script><script>async function send(){try{await api('submit',{method:'POST',body:JSON.stringify({author_name:$('author').value,title:$('title').value,category:$('cat').value,excerpt:$('ex').value,content:$('content').value,lesson:$('lesson').value,image_url:$('image').value,video_url:$('video').value})});$('msg').textContent='✅ कहानी भेज दी गई। Admin approval के बाद publish होगी।';}catch(e){$('msg').textContent='❌ '+e.message}}$('send').onclick=send</script></body></html>
