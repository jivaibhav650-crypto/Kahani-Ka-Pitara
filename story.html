<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>कहानी | Kahani Ka Pitara</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">📖 Kahani Ka Pitara</a><nav><a href="index.html">Stories</a><a href="news.html">News</a><a href="blog.html">Blog</a><a href="profile.html">Profile</a></nav></div></header><main class="wrap reading" id="story">कहानी खुल रही है…</main><script src="app.js"></script><script>const id=new URLSearchParams(location.search).get('id');api('story?id='+encodeURIComponent(id)).then(r=>{const d=r.item;document.title=d.title+' | Kahani Ka Pitara';$('story').innerHTML=`<span class="pill">${esc(d.category||'कहानी')}</span><h1>${esc(d.title)}</h1>${d.image_url?`<img class="story-img" src="${esc(d.image_url)}" alt="${esc(d.title)}">`:''}${d.video_url?`<div class="story-video"><video controls playsinline preload="metadata" src="${esc(d.video_url)}"></video><p><a class="btn" href="${esc(d.video_url)}" target="_blank">🎥 Video खोलें</a></p></div>`:''}${d.content.split(/\n+/).filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join('')}${d.lesson?`<div class="lesson"><b>🌟 कहानी की सीख</b><p>${esc(d.lesson)}</p></div>`:''}<p>👁️ ${Number(d.views||0)} views</p><div class="actions"><button class="primary" onclick="navigator.clipboard.writeText(location.href);this.textContent='✓ Link Copied'">🔗 Link Copy</button><button class="primary" onclick="window.open('https://wa.me/?text='+encodeURIComponent(document.title+'\n'+location.href),'_blank')">📲 WhatsApp</button><button class="primary" onclick="navigator.share?navigator.share({title:document.title,url:location.href}):navigator.clipboard.writeText(location.href)">📤 Share</button></div>`;track('/story',id)}).catch(e=>$('story').innerHTML='<div class="panel">❌ '+esc(e.message)+'</div>')</script></body></html>
