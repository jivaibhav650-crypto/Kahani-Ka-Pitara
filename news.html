<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hindi News</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">📖 Kahani Ka Pitara</a><nav><a href="index.html">Stories</a><a href="blog.html">📝 Blog</a><a href="community.html">💬 Chat</a><a href="profile.html">👤 Profile</a></nav></div></header><main class="wrap"><h1>📰 Hindi News</h1><div id="list" class="grid"><div class="panel">News लोड हो रही है…</div></div></main><script src="app.js"></script><script>api('posts?type=news').then(r=>{const d=r.items||[];$('list').innerHTML=d.length?d.map(x=>`<article class="card" onclick="location.href='post.html?id=${encodeURIComponent(x.id)}'"><div class="thumb">${x.image_url?`<img src="${esc(x.image_url)}" alt="">`:'📰'}</div><div class="body"><span class="pill">${esc(x.category||'News')}</span><h2>${esc(x.title)}</h2><p>${esc(x.excerpt)}</p><span class="btn">पूरा पढ़ें →</span></div></article>`).join(''):'<div class="panel">अभी कोई published News नहीं है।</div>';track(location.pathname)}).catch(e=>$('list').innerHTML='<div class="panel">❌ '+esc(e.message)+'</div>')</script></body></html>
