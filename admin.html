<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Kahani Ka Pitara</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">📖 Kahani Ka Pitara — Admin</a><nav><a href="index.html">Website</a></nav></div></header><main class="wrap form"><div id="loginBox" class="panel"><h1>🔐 Admin Login</h1><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="primary" id="login">Login</button><button class="success" id="signup">पहली बार Admin बनाएं</button><p id="loginMsg"></p></div><div id="app" class="hidden"><div class="panel"><h1>📊 Admin Dashboard</h1><p id="who"></p><div id="stats" class="notice">Analytics loading…</div><button class="danger" id="logout">Logout</button></div><div class="panel"><h2>📖 Story / News / Blog</h2><p class="hint">बस content लिखें। Title और description खाली हो सकते हैं। Image/Video optional हैं।</p><select id="cat"><option>भगवान</option><option>भूत</option><option>प्रेम</option><option>प्रेरणादायक</option><option>बच्चों की कहानी</option><option>परिवार</option><option>रहस्यमयी</option><option>जानवरों की कहानी</option><option>News</option><option>Blog</option></select><input id="title" placeholder="Title (optional)"><input id="excerpt" placeholder="Short description (optional)"><input id="emoji" placeholder="Emoji (optional)"><textarea id="content" placeholder="पूरी कहानी / News / Blog"></textarea><textarea id="lesson" placeholder="कहानी की सीख (optional)"></textarea><label>🖼️ Image</label><input id="image" type="file" accept="image/*"><label>🎥 Video</label><input id="video" type="file" accept="video/*"><div class="actions"><button class="success" id="save">Publish</button><button class="muted" id="clear">Clear</button></div><p id="saveMsg"></p></div><div class="panel"><h2>📚 Published Stories</h2><div id="stories"></div></div><div class="panel"><h2>📰 News & 📝 Blog</h2><div id="posts"></div></div><div class="panel"><h2>⏳ User Submissions</h2><div id="subs"></div></div></div></main><script src="app.js"></script><script>let editing='';function msg(id,t){$(id).textContent=t}async function refresh(){const me=await api('auth/me');if(!me.user||me.user.role!=='admin'){throw new Error('Admin login required')}$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=me.user.email;const [s,p,sub,a]=await Promise.all([api('admin/stories'),api('admin/posts'),api('admin/submissions'),api('analytics')]);$('stats').textContent=`📊 Total page views: ${a.pageViews} | Today: ${a.today} | Story views: ${a.storyViews}`;$('stories').innerHTML=(s.items||[]).map(x=>`<div class="row"><div>${x.image_url?`<img src="${esc(x.image_url)}">`:esc(x.emoji||'📖')}</div><div><b>${esc(x.title)}</b><br><small>${esc(x.category)} • 👁️ ${x.views||0}</small></div><div class="row-actions"><button class="muted" onclick='editStory(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick="delStory('${x.id}')">Delete</button></div></div>`).join('')||'<p>कोई story नहीं</p>';$('posts').innerHTML=(p.items||[]).map(x=>`<div class="row"><div>${x.type==='news'?'📰':'📝'}</div><div><b>${esc(x.title)}</b><br><small>${x.type} • ${x.status}</small></div><div class="row-actions"><button class="muted" onclick='editPost(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick="delPost('${x.id}')">Delete</button></div></div>`).join('')||'<p>कोई News/Blog नहीं</p>';$('subs').innerHTML=(sub.items||[]).map(x=>`<div class="panel"><b>${esc(x.title)}</b><p>${esc(x.author_name)} • ${esc(x.category)}</p><p>${esc(x.excerpt)}</p><div class="actions"><button class="success" onclick="approve('${x.id}')">Approve</button><button class="danger" onclick="reject('${x.id}')">Reject</button></div></div>`).join('')||'<p>कोई pending submission नहीं</p>'}
function editStory(x){editing=x.id;$('cat').value=x.category;$('title').value=x.title;$('excerpt').value=x.excerpt||'';$('emoji').value=x.emoji||'';$('content').value=x.content;$('lesson').value=x.lesson||'';scrollTo(0,0)}function editPost(x){editing='post:'+x.id;$('cat').value=x.type==='news'?'News':'Blog';$('title').value=x.title;$('excerpt').value=x.excerpt||'';$('content').value=x.content;scrollTo(0,0)}async function delStory(id){if(confirm('Delete?')){await api('admin/story?id='+id,{method:'DELETE'});refresh()}}async function delPost(id){if(confirm('Delete?')){await api('admin/post?id='+id,{method:'DELETE'});refresh()}}async function approve(id){await api('admin/submission',{method:'POST',body:JSON.stringify({id,status:'approved'})});refresh()}async function reject(id){await api('admin/submission',{method:'POST',body:JSON.stringify({id,status:'rejected'})});refresh()}$('signup').onclick=async()=>{try{const email=$('email').value.trim(),password=$('pass').value;if(!email||password.length<6)throw new Error('Email और कम से कम 6 अक्षर का password डालें');const r=await api('auth/signup',{method:'POST',body:JSON.stringify({email,password,name:'Admin'})});msg('loginMsg',r.user?.role==='admin'?'✅ Admin account बन गया। अब dashboard खुल रहा है।':'⚠️ Account बना, लेकिन Admin नहीं मिला। Cloudflare में BOOTSTRAP_ADMIN_EMAIL इसी email पर रखें।');refresh()}catch(e){msg('loginMsg','❌ '+e.message)}};$('login').onclick=async()=>{try{await api('auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('pass').value})});refresh()}catch(e){msg('loginMsg','❌ '+e.message)}};$('logout').onclick=async()=>{await api('auth/logout',{method:'POST'});location.reload()};$('clear').onclick=()=>{editing='';['title','excerpt','emoji','content','lesson'].forEach(id=>$(id).value='');$('image').value='';$('video').value=''};$('save').onclick=async()=>{try{let iu='',vu='';if($('image').files[0]){const f=new FormData();f.append('file',$('image').files[0]);const r=await fetch('/api/admin/upload',{method:'POST',body:f});const d=await r.json();if(!r.ok)throw new Error(d.error);iu=d.url}if($('video').files[0]){const f=new FormData();f.append('file',$('video').files[0]);const r=await fetch('/api/admin/upload',{method:'POST',body:f});const d=await r.json();if(!r.ok)throw new Error(d.error);vu=d.url}const c=$('cat').value;if(c==='News'||c==='Blog'){const old=editing.startsWith('post:')?editing.slice(5):'';await api('admin/post',{method:'POST',body:JSON.stringify({id:old,type:c==='News'?'news':'blog',title:$('title').value,category:c,excerpt:$('excerpt').value,content:$('content').value,image_url:iu,status:'published'})})}else{await api('admin/story',{method:'POST',body:JSON.stringify({id:editing&&!editing.startsWith('post:')?editing:'',category:c,title:$('title').value,excerpt:$('excerpt').value,emoji:$('emoji').value,content:$('content').value,lesson:$('lesson').value,image_url:iu,video_url:vu})})}msg('saveMsg','✅ Publish/Update हो गया');$('clear').click();refresh()}catch(e){msg('saveMsg','❌ '+e.message)}};refresh().catch(e=>msg('loginMsg','❌ '+e.message))</script></body></html>
