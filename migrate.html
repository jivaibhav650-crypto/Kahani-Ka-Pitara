<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One-time migration</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap form"><h1>🔄 One-time Supabase → Cloudflare migration</h1><div class="panel"><p>यह page सिर्फ पुराने data को Cloudflare D1 में copy करने के लिए है। Migration के बाद Supabase की जरूरत नहीं रहेगी। पहले Cloudflare Admin में login करें।</p><input id="url" value="https://gkrhofcjrqhipwtqddqi.supabase.co" placeholder="Old Supabase URL"><input id="key" placeholder="Old Supabase publishable/anon key"><button class="primary" id="go">Import Stories & News/Blog</button><p id="m"></p></div></main><script src="app.js"></script><script>async function rest(table){const base=$('url').value.replace(/\/$/,'');const key=$('key').value.trim();const r=await fetch(base+'/rest/v1/'+table+'?select=*',{headers:{apikey:key,Authorization:'Bearer '+key}});if(!r.ok)throw new Error(table+': '+await r.text());return r.json()}$('go').onclick=async()=>{try{const me=await api('auth/me');if(!me.user||me.user.role!=='admin')throw new Error('पहले Admin login करें');msg='Data पढ़ा जा रहा है…';$('m').textContent=msg;const [stories,posts]=await Promise.all([rest('stories'),rest('posts')]);await api('migrate',{method:'POST',body:JSON.stringify({stories,posts})});$('m').textContent=`✅ Migration complete: ${stories.length} stories, ${posts.length} posts`; }catch(e){$('m').textContent='❌ '+e.message}}</script></body></html>
