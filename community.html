<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Chat</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">📖 Kahani Ka Pitara</a><nav><a href="index.html">Stories</a><a href="profile.html">Profile</a></nav></div></header><main class="wrap"><h1>💬 Community Chat</h1><div class="panel"><div id="gate" class="notice">पहले Profile से Login करें।</div><div id="chat" class="hidden"><div id="messages" class="messages"></div><div class="composer"><input id="text" placeholder="Message…"><button class="primary" id="send">Send</button></div></div></div></main><script src="app.js"></script><script>async function load(){const me=await api('auth/me');if(!me.user)return; $('gate').classList.add('hidden');$('chat').classList.remove('hidden');const r=await api('chat');$('messages').innerHTML=(r.items||[]).map(x=>`<div class="msg ${x.email===me.user.email?'mine':''}"><b>${esc(x.name||x.email)}</b><br>${esc(x.message)}</div>`).join('')||'<p>अभी कोई message नहीं है।';$('messages').scrollTop=$('messages').scrollHeight}$('send').onclick=async()=>{try{await api('chat',{method:'POST',body:JSON.stringify({message:$('text').value})});$('text').value='';load()}catch(e){alert(e.message)}};load();setInterval(load,5000)</script></body></html>
